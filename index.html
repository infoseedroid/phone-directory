<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>دليل هاتف موظفي دائرة الإفتاء العام</title>


<style>

@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');


*{
box-sizing:border-box;
}


body{

margin:0;
background:#f3f4f6;
font-family:'Cairo',sans-serif;

}


header{

background:white;
color:green;
padding:15px;
text-align:center;
font-size:21px;
font-weight:bold;

}


.logo{

width:80px;
height:80px;
object-fit:contain;
display:block;
margin:auto;

}


/* منطقة التحكم */

.controls{

padding:12px;

}



select,input,textarea{

width:100%;
padding:12px;
border-radius:12px;
border:1px solid #ddd;
font-family:'Cairo',sans-serif;
font-size:15px;
margin-bottom:10px;

}



.main-buttons{

display:flex;
gap:10px;
margin-bottom:10px;

}


.main-buttons button{

flex:1;
padding:12px;
border:none;
border-radius:12px;
color:white;
font-family:'Cairo',sans-serif;
font-size:15px;

}


.search-btn{

background:#2563eb;

}


.clear-btn{

background:#777;

}


.add-btn{

background:#16a34a;

}


/* العداد */

.counter{

text-align:center;
font-weight:bold;
padding:10px;

}



/* الكروت */


.container{

padding:12px;

display:grid;

grid-template-columns:repeat(auto-fit,minmax(260px,1fr));

gap:12px;

}



.card{

background:white;
border-radius:18px;
padding:16px;
text-align:center;
box-shadow:0 4px 12px #0002;

}



.card img{

width:100px;
height:100px;
border-radius:50%;
object-fit:cover;
border:4px solid #1d4ed8;

}


.name{

font-size:20px;
font-weight:bold;
margin:8px;

}


.info{

line-height:2;
color:#555;

}



.phone{

width:100%;
padding:11px;
background:#16a34a;
color:white;
border:none;
border-radius:10px;
font-size:16px;
font-family:'Cairo',sans-serif;

}



.edit-btn{

width:100%;
padding:10px;
margin-top:8px;
background:#f59e0b;
color:white;
border:none;
border-radius:10px;
font-family:'Cairo',sans-serif;

}



/* النوافذ */

.modal{

display:none;

position:fixed;

inset:0;

background:#0008;

z-index:1000;

align-items:center;

justify-content:center;

}



.modal-box{

background:white;

width:90%;

max-width:380px;

border-radius:25px;

padding:20px;

text-align:center;

max-height:90vh;

overflow:auto;

}



.modal-title{

font-size:21px;
font-weight:bold;
margin-bottom:15px;

}



.modal-buttons{

display:flex;
gap:10px;

}



.modal-buttons button{

flex:1;
padding:12px;
border:none;
border-radius:12px;
color:white;
font-family:'Cairo',sans-serif;

}



.send{

background:#16a34a;

}



.close{

background:#777;

}



/* نافذة الاتصال القديمة */


.modal-box img{

width:100px;
height:100px;
border-radius:50%;
object-fit:cover;

}


.call{

background:#2563eb;

}



.whatsapp{

background:#16a34a;

}



</style>

</head>


<body>


<header>

<img src="https://www.aliftaa.jo/images/newIftaLogoJpg_.jpg" class="logo">

<div>
📞 دليل هاتف موظفي دائرة الإفتاء العام
</div>

</header>



<div class="controls">


<div class="main-buttons">


<button class="add-btn"
onclick="openAddRequest()">

➕ طلب إضافة جهة اتصال

</button>


</div>



<select id="searchType"
onchange="changePlaceholder()">


<option value="name">الاسم</option>

<option value="department">المسمى الوظيفي</option>

<option value="location">موقع العمل</option>

<option value="extension">الرقم الفرعي</option>

<option value="phone">رقم الهاتف</option>


</select>



<input id="searchInput"
placeholder="ابحث بالاسم..."
onkeydown="if(event.key==='Enter')searchEmployee()">



<div class="main-buttons">


<button class="search-btn"
onclick="searchEmployee()">

🔍 بحث

</button>


<button class="clear-btn"
onclick="clearSearch()">

✖ مسح

</button>


</div>


</div>



<div class="counter" id="counter">

عدد الموظفين: 0

</div>



<div class="container" id="cards">

</div>
<!-- نافذة طلب إضافة جهة اتصال -->

<div class="modal" id="addModal">

<div class="modal-box">


<div class="modal-title">
➕ طلب إضافة جهة اتصال
</div>


<input id="addName" placeholder="الاسم">

<input id="addPhone" placeholder="رقم الهاتف">

<input id="addExtension" placeholder="الرقم الفرعي">

<input id="addLocation" placeholder="موقع العمل">

<input id="addDepartment" placeholder="المسمى الوظيفي">

<textarea id="addNotes" placeholder="ملاحظات"></textarea>



<div class="modal-buttons">


<button class="send"
onclick="sendAddRequest()">

إرسال واتساب

</button>


<button class="close"
onclick="closeAddRequest()">

إغلاق

</button>


</div>


</div>

</div>





<!-- نافذة طلب تعديل -->

<div class="modal" id="editModal">

<div class="modal-box">


<div class="modal-title">
✏️ طلب تعديل بيانات
</div>



<input id="editName" readonly>


<input id="editPhone" placeholder="رقم الهاتف الجديد">


<input id="editExtension" placeholder="الرقم الفرعي الجديد">


<input id="editLocation" placeholder="موقع العمل الجديد">


<input id="editDepartment" placeholder="المسمى الوظيفي الجديد">


<textarea id="editNotes" placeholder="اذكر التعديل المطلوب"></textarea>




<div class="modal-buttons">


<button class="send"
onclick="sendEditRequest()">

إرسال واتساب

</button>


<button class="close"
onclick="closeEditRequest()">

إغلاق

</button>


</div>



</div>

</div>




<script>


let employees=[];


let currentEmployee=null;



const adminWhatsApp="962796111656";



const sheetURL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTItYAMnnZRrpDxva40rx1kMEoyUNCtXZ-ft3Tdv28aBZUjwtNscq69M9G05MYf2TJcr6CgJCvY2LQC/pub?gid=0&single=true&output=csv";




// تحميل البيانات


async function loadEmployees(){


try{


let response=await fetch(sheetURL);


let csv=await response.text();


let rows=csv.split(/\r?\n/);


rows.shift();



employees=rows
.filter(x=>x.trim()!="")
.map(row=>{


let v=row.split(",");


return {


name:v[1]||"",

phone:v[2]||"",

extension:v[3]||"",

location:v[4]||"",

department:v[5]||"",

image:"emp.png"


};


});



displayEmployees(employees);



}

catch(e){

console.log(e);

}


}





function displayEmployees(list){


let box=document.getElementById("cards");


box.innerHTML="";


document.getElementById("counter").innerHTML=

"عدد الموظفين: "+list.length;



list.forEach(emp=>{


box.innerHTML+=`


<div class="card">


<img src="${emp.image}"
onerror="this.src='emp.png'">



<div class="name">

${emp.name}

</div>



<div class="info">

📍 ${emp.location}

<br>

🏢 ${emp.department}

<br>

☎ ${emp.extension}

</div>



<button class="phone"
onclick='showContact("${emp.phone}","${emp.name}")'>

☎ ${emp.phone}

</button>



<button class="edit-btn"
onclick='openEditRequest(${JSON.stringify(emp)})'>

✏️ طلب تعديل البيانات

</button>


</div>


`;


});


}




// فتح طلب التعديل


function openEditRequest(emp){


currentEmployee=emp;


document.getElementById("editName").value=emp.name;


document.getElementById("editPhone").value=emp.phone;


document.getElementById("editExtension").value=emp.extension;


document.getElementById("editLocation").value=emp.location;


document.getElementById("editDepartment").value=emp.department;


document.getElementById("editNotes").value="";



document.getElementById("editModal").style.display="flex";


}




function closeEditRequest(){

document.getElementById("editModal").style.display="none";

}





// إرسال تعديل واتساب


function sendEditRequest(){


let msg=
`
طلب تعديل بيانات موظف

الاسم:
${editName.value}

رقم الهاتف:
${editPhone.value}

الرقم الفرعي:
${editExtension.value}

موقع العمل:
${editLocation.value}

المسمى الوظيفي:
${editDepartment.value}

ملاحظات:
${editNotes.value}

التاريخ:
${new Date().toLocaleString("ar-JO")}
`;



openWhatsApp(msg);

);



}





// إضافة جهة اتصال


function openAddRequest(){


document.getElementById("addModal").style.display="flex";


}



function closeAddRequest(){

document.getElementById("addModal").style.display="none";

}




function sendAddRequest(){


let msg=
`
طلب إضافة جهة اتصال جديدة

الاسم:
${addName.value}

رقم الهاتف:
${addPhone.value}

الرقم الفرعي:
${addExtension.value}

موقع العمل:
${addLocation.value}

المسمى الوظيفي:
${addDepartment.value}

ملاحظات:
${addNotes.value}

التاريخ:
${new Date().toLocaleString("ar-JO")}

`;



openWhatsApp(msg);


);


}





// البحث


function searchEmployee(){


let text=
searchInput.value.toLowerCase().trim();


let type=
searchType.value;



displayEmployees(

employees.filter(e=>

(e[type]||"")
.toLowerCase()
.includes(text)

)

);


}





function clearSearch(){

searchInput.value="";

displayEmployees(employees);

}





function changePlaceholder(){


let p={

name:"ابحث بالاسم...",

department:"ابحث بالمسمى الوظيفي...",

location:"ابحث بموقع العمل...",

extension:"أدخل الرقم الفرعي...",

phone:"أدخل رقم الهاتف..."

};


searchInput.placeholder=
p[searchType.value];


}




// الاتصال


function showContact(phone,name){


window.location.href="tel:"+phone;


}




window.onload=function(){

loadEmployees();

};
function openWhatsApp(message){

    let whatsappURL =
    "whatsapp://send?phone=" 
    + adminWhatsApp
    + "&text="
    + encodeURIComponent(message);


    let webURL =
    "https://wa.me/"
    + adminWhatsApp
    + "?text="
    + encodeURIComponent(message);



    // محاولة فتح تطبيق واتساب مباشرة

    window.location.href = whatsappURL;



    // احتياط إذا لم يفتح التطبيق

    setTimeout(function(){

        window.location.href = webURL;

    },1500);


}

</script>


</body>

</html>
