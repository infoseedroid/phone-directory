<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>دليل هاتف الموظفين</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');

*{
box-sizing:border-box;
}

body{
margin:0;
background:#f3f4f6;
font-family:'Cairo',sans-serif;
}

header{
background:white;
color:green;
padding:18px;
text-align:center;
font-size:22px;
font-weight:bold;
}

.search{
padding:15px;
}

.search input{
width:100%;
padding:14px;
border-radius:12px;
border:1px solid #ddd;
font-size:16px;
}

.container{
padding:15px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:15px;
}

.card{
background:white;
border-radius:18px;
padding:20px;
text-align:center;
box-shadow:0 4px 12px #0002;
}

.card img{
width:110px;
height:110px;
border-radius:50%;
object-fit:cover;
border:4px solid #1d4ed8;
}

.name{
font-size:20px;
font-weight:bold;
margin-top:10px;
}

.info{
line-height:2;
color:#555;
margin-top:10px;
}

.phone{

display:block;
width:100%;
background:#16a34a;
color:white;
padding:12px;
border-radius:10px;
margin-top:12px;
border:none;
font-size:16px;
font-family:'Cairo',sans-serif;
cursor:pointer;

}

.logo{

width:80px;
height:80px;
object-fit:contain;
display:block;
margin:0 auto 10px auto;

}

.modal{

display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#0008;
z-index:1000;
align-items:center;
justify-content:center;

}


.modal-box{

background:white;
width:85%;
max-width:350px;
border-radius:25px;
padding:25px;
text-align:center;
animation:show .3s;

}


@keyframes show{

from{
transform:scale(.7);
opacity:0;
}

to{
transform:scale(1);
opacity:1;
}

}


.modal-box img{

width:100px;
height:100px;
border-radius:50%;
object-fit:cover;
border:4px solid #1d4ed8;

}


.modal-name{

font-size:22px;
font-weight:bold;
margin:10px;

}


.modal-phone{

color:#666;
font-size:18px;
margin-bottom:20px;

}


.action{

display:flex;
gap:10px;

}


.action a{

flex:1;
padding:12px;
border-radius:12px;
color:white;
text-decoration:none;
font-size:16px;

}


.call{

background:#2563eb;

}


.whatsapp{

background:#16a34a;

}


.close{

margin-top:15px;
background:#eee;
padding:10px;
border-radius:12px;
cursor:pointer;

}
</style>

</head>

<body>

<header>

<img src="https://www.aliftaa.jo/images/newIftaLogoJpg_.jpg" class="logo">

<div>
📞 دليل هاتف موظفي دائرة الإفتاء العام
</div>

</header>


<div class="search">
<input id="search" placeholder="ابحث عن موظف..." onkeyup="searchEmployee()">
</div>


<div class="container" id="cards"></div>




<script>

let employees = [];

const sheetURL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTItYAMnnZRrpDxva40rx1kMEoyUNCtXZ-ft3Tdv28aBZUjwtNscq69M9G05MYf2TJcr6CgJCvY2LQC/pub?gid=0&single=true&output=csv";


const imagesURL =
"https://script.google.com/macros/s/AKfycbySOHWCXFT5LMKwECpIL-_6sYcWmUggUcHeDrSPA4gBIPg7wWCBjyJnF9Om_Q6HHJhgEA/exec";



async function loadEmployees(){

try{

let csvResponse = await fetch(sheetURL);

let csv = await csvResponse.text();


let imagesResponse = await fetch(imagesURL);

let images = await imagesResponse.json();


let rows = csv.split(/\r?\n/);

rows.shift();


employees = rows
.filter(row=>row.trim()!="")
.map(row=>{


let values=row.split(",");


let id = values[0]?.trim();


return {

id:id,

name:values[1]?.trim(),

phone:values[2]?.trim(),

extension:values[3]?.trim(),

location:values[4]?.trim(),

department:values[5]?.trim(),

image:images[id] || "https://i.pravatar.cc/300"

};


});


display(employees);


}

catch(error){

document.getElementById("cards").innerHTML=
`
<div class="card">
<div class="name">خطأ في تحميل البيانات</div>
<div class="info">${error}</div>
</div>
`;

console.log(error);

}

}




function display(list){

let box=document.getElementById("cards");

box.innerHTML="";


list.forEach(emp=>{


box.innerHTML +=`

<div class="card">

<img src="${emp.image}">

<div class="name">
${emp.name}
</div>

<div class="info">

📍 ${emp.location}

<br>

🏢 ${emp.department}

<br>

☎ ${emp.extension}

</div>


<button class="phone" onclick="showContact('${emp.phone}','${emp.name}','${emp.image}')">

☎ ${emp.phone}

</button>

</div>

`;

});


}




function searchEmployee(){

let text=document
.getElementById("search")
.value
.toLowerCase()
.trim();



let result=employees.filter(e=>

(e.name && e.name.toLowerCase().includes(text))

||

(e.location && e.location.toLowerCase().includes(text))

||

(e.department && e.department.toLowerCase().includes(text))

||

(e.extension && e.extension.includes(text))

||

(e.phone && e.phone.includes(text))

);



display(result);

}




function showContact(phone,name,image){


document.getElementById("modalImage").src=image;

document.getElementById("modalName").innerHTML=name;

document.getElementById("modalPhone").innerHTML=phone;


document.getElementById("callBtn").href="tel:"+phone;


let whatsappNumber=phone;

if(phone.startsWith("0")){
whatsappNumber=phone.substring(1);
}


document.getElementById("waBtn").href=
"https://wa.me/962"+whatsappNumber;


document.getElementById("contactModal").style.display="flex";


}




function closeModal(){

document.getElementById("contactModal").style.display="none";

}




window.onload=function(){

loadEmployees();

};
</script>

<div class="modal" id="contactModal">

<div class="modal-box">

<img id="modalImage">

<div class="modal-name" id="modalName"></div>

<div class="modal-phone" id="modalPhone"></div>


<div class="action">

<a id="callBtn" class="call">
📞 اتصال
</a>


<a id="waBtn" class="whatsapp">
💬 واتساب
</a>

</div>


<div class="close" onclick="closeModal()">
إغلاق
</div>


</div>

</div>
</body>
</html>
