<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>دليل هاتف موظفي دائرة الإفتاء العام</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f3f4f6;
    font-family:'Cairo',sans-serif;
}

header{
    background:#ffffff;
    color:green;
    padding:15px;
    text-align:center;
    font-size:21px;
    font-weight:bold;
}

.logo{
    width:75px;
    height:75px;
    object-fit:contain;
    display:block;
    margin:auto;
}


.search{
    padding:12px;
    position:sticky;
    top:0;
    background:#f3f4f6;
    z-index:10;
}

.search input{

    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid #ddd;
    font-size:16px;
    font-family:'Cairo',sans-serif;

}


.container{

    padding:12px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:12px;

}


.card{

    background:white;
    border-radius:18px;
    padding:16px;
    text-align:center;
    box-shadow:0 3px 10px #0002;

}


.card img{

    width:95px;
    height:95px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid #1d4ed8;

}


.name{

    font-size:19px;
    font-weight:bold;
    margin-top:8px;

}


.info{

    line-height:1.9;
    color:#555;
    font-size:15px;

}


.phone{

    width:100%;
    background:#16a34a;
    color:white;
    padding:11px;
    border-radius:10px;
    border:0;
    margin-top:10px;
    font-size:16px;
    font-family:'Cairo',sans-serif;

}


/* النافذة */

.modal{

    display:none;
    position:fixed;
    inset:0;
    background:#0008;
    z-index:1000;
    align-items:center;
    justify-content:center;

}


.modal-box{

    background:white;
    width:85%;
    max-width:350px;
    border-radius:25px;
    padding:25px;
    text-align:center;

}


.modal-box img{

    width:100px;
    height:100px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid #1d4ed8;

}


.modal-name{

    font-size:22px;
    font-weight:bold;
    margin:10px;

}


.modal-phone{

    color:#666;
    font-size:18px;
    margin-bottom:15px;

}


.action{

    display:flex;
    gap:10px;

}


.action a{

    flex:1;
    padding:12px;
    border-radius:12px;
    color:white;
    text-decoration:none;

}


.call{

    background:#2563eb;

}


.whatsapp{

    background:#16a34a;

}


.close{

    margin-top:15px;
    background:#eee;
    padding:10px;
    border-radius:12px;

}


</style>

</head>


<body>


<header>

<img src="https://www.aliftaa.jo/images/newIftaLogoJpg_.jpg" class="logo">

<div>
📞 دليل هاتف موظفي دائرة الإفتاء العام
</div>

</header>


<div class="search">

<input id="search"
placeholder="ابحث عن موظف..."
oninput="searchEmployee()">

</div>


<div class="container" id="cards"></div>


<div class="modal" id="contactModal">

<div class="modal-box">

<img id="modalImage">

<div class="modal-name" id="modalName"></div>

<div class="modal-phone" id="modalPhone"></div>


<div class="action">

<a id="callBtn" class="call">
📞 اتصال
</a>


<a id="waBtn" class="whatsapp">
💬 واتساب
</a>

</div>


<div class="close" onclick="closeModal()">
إغلاق
</div>


</div>

</div>
<script>

let employees = [];
let searchIndex = [];

const sheetURL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTItYAMnnZRrpDxva40rx1kMEoyUNCtXZ-ft3Tdv28aBZUjwtNscq69M9G05MYf2TJcr6CgJCvY2LQC/pub?gid=0&single=true&output=csv";


// تحميل البيانات

async function loadEmployees(){

    let cached = localStorage.getItem("employeesData");

    if(cached){

        employees = JSON.parse(cached);
        createSearchIndex();
        display(employees);
    }


    try{

        let response = await fetch(sheetURL);

        let csv = await response.text();

        let rows = parseCSV(csv);

        rows.shift();


        employees = rows
        .filter(r=>r.length>1)
        .map(r=>{


            return {

                id:(r[0]||"").replace(".0","").trim(),

                name:(r[1]||"").trim(),

                phone:(r[2]||"").trim(),

                extension:(r[3]||"").trim(),

                location:(r[4]||"").trim(),

                department:(r[5]||"").trim(),

                image:"emp.png"

            };


        });


        localStorage.setItem(
            "employeesData",
            JSON.stringify(employees)
        );


        createSearchIndex();

        display(employees);


    }

    catch(e){

        if(employees.length==0){

            document.getElementById("cards").innerHTML=
            `
            <div class="card">
            <div class="name">
            خطأ في تحميل البيانات
            </div>
            </div>
            `;

        }

        console.log(e);

    }

}



// قراءة CSV بطريقة صحيحة

function parseCSV(text){

    let result=[];

    let row=[];

    let value="";

    let inside=false;


    for(let i=0;i<text.length;i++){

        let c=text[i];


        if(c=='"'){

            inside=!inside;

        }

        else if(c==',' && !inside){

            row.push(value);

            value="";

        }

        else if((c=="\n" || c=="\r") && !inside){

            if(value!=="" || row.length){

                row.push(value);

                result.push(row);

                row=[];

                value="";

            }

        }

        else{

            value+=c;

        }

    }


    if(value || row.length){

        row.push(value);

        result.push(row);

    }


    return result;

}



// إنشاء فهرس بحث سريع

function createSearchIndex(){

    searchIndex = employees.map(emp=>({

        employee:emp,

        text:
        (
            emp.name+" "+
            emp.phone+" "+
            emp.extension+" "+
            emp.location+" "+
            emp.department
        ).toLowerCase()

    }));

}



// عرض الموظفين

function display(list){

    let box=document.getElementById("cards");

    box.innerHTML="";


    list.forEach(emp=>{


        box.innerHTML +=`

        <div class="card">

        <img src="${emp.image}"
        onerror="this.src='emp.png'">


        <div class="name">
        ${emp.name}
        </div>


        <div class="info">

        📍 ${emp.location}

        <br>

        🏢 ${emp.department}

        <br>

        ☎ ${emp.extension}

        </div>


        <button class="phone"
        onclick='showContact(${JSON.stringify(emp.phone)},${JSON.stringify(emp.name)},${JSON.stringify(emp.image)})'>

        ☎ ${emp.phone}

        </button>


        </div>

        `;


    });

}



// البحث السريع

function searchEmployee(){

    let text=
    document.getElementById("search")
    .value
    .trim()
    .toLowerCase();


    if(text===""){

        display(employees);

        return;

    }


    let result=
    searchIndex
    .filter(x=>x.text.includes(text))
    .map(x=>x.employee);


    display(result);

}



// نافذة الاتصال

function showContact(phone,name,image){


    document.getElementById("modalImage").src=image;

    document.getElementById("modalName").innerHTML=name;

    document.getElementById("modalPhone").innerHTML=phone;


    document.getElementById("callBtn").href=
    "tel:"+phone;



    let number=phone.replace(/^0/,"");


    document.getElementById("waBtn").href=
    "https://wa.me/962"+number;


    document.getElementById("contactModal")
    .style.display="flex";


}



function closeModal(){

    document.getElementById("contactModal")
    .style.display="none";

}



window.onload=function(){

    loadEmployees();

};


</script>

</body>
</html>
