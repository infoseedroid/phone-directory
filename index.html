<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>دليل هاتف موظفي دائرة الإفتاء العام</title>


<style>

@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');


*{
box-sizing:border-box;
}


body{

margin:0;
background:#f3f4f6;
font-family:'Cairo',sans-serif;

}



/* شاشة التحميل */

#loadingScreen{

position:fixed;
inset:0;
background:white;
z-index:9999;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;

}


#loadingScreen img{

width:90px;
height:90px;
object-fit:contain;

}


.spinner{

margin-top:20px;
width:45px;
height:45px;
border:5px solid #ddd;
border-top:5px solid green;
border-radius:50%;
animation:spin 1s linear infinite;

}


@keyframes spin{

100%{
transform:rotate(360deg);
}

}


.loading-text{

margin-top:15px;
font-size:18px;
font-weight:bold;

}




header{

background:white;
color:green;
padding:15px;
text-align:center;
font-size:21px;
font-weight:bold;

}



.logo{

width:80px;
height:80px;
object-fit:contain;
display:block;
margin:auto;

}




.controls{

padding:12px;

}




select,input,textarea{

width:100%;
padding:12px;
border-radius:12px;
border:1px solid #ddd;
font-family:'Cairo',sans-serif;
font-size:15px;
margin-bottom:10px;

}





.main-buttons{

display:flex;
gap:10px;
margin-bottom:10px;

}





.main-buttons button{

flex:1;
padding:12px;
border:none;
border-radius:12px;
color:white;
font-family:'Cairo',sans-serif;
font-size:15px;

}





.search-btn{

background:#2563eb;

}



.search-btn.loading{

opacity:.7;

pointer-events:none;

}




.clear-btn{

background:#777;

}




.refresh-btn{

background:#0891b2;

}





.add-btn{

background:#16a34a;

}






/* قائمة خدمات الدليل */


.service-menu{

position:relative;
flex:1;

}



.service-main-btn{

width:100%;
padding:12px;
background:#16a34a;
color:white;
border:none;
border-radius:12px;
font-family:'Cairo',sans-serif;
font-size:15px;

}



.service-dropdown{

display:none;
position:absolute;
top:55px;
right:0;
left:0;
background:white;
border-radius:12px;
box-shadow:0 4px 15px #0003;
z-index:500;
overflow:hidden;

}



.service-dropdown button{

width:100%;
padding:12px;
border:none;
background:white;
font-family:'Cairo',sans-serif;
font-size:15px;
text-align:right;

}





.counter{

text-align:center;
font-weight:bold;
padding:10px;

}




.message-box{

display:none;
margin:10px 12px;
padding:15px;
background:white;
border-radius:15px;
text-align:center;
font-weight:bold;
box-shadow:0 3px 10px #0002;

}





.container{

padding:12px;

display:grid;

grid-template-columns:repeat(auto-fit,minmax(260px,1fr));

gap:12px;

}




.card{

background:white;
border-radius:18px;
padding:16px;
text-align:center;
box-shadow:0 4px 12px #0002;
position:relative;

}




.card img{

width:100px;
height:100px;
border-radius:50%;
object-fit:cover;
border:4px solid #1d4ed8;

}




.card-menu{

position:absolute;
top:10px;
right:10px;

}




.card-menu-btn{

background:#777;
color:white;
border:none;
border-radius:50%;
width:35px;
height:35px;
font-size:22px;

}





.card-actions{

display:none;
position:absolute;
right:0;
top:40px;
background:white;
border-radius:12px;
box-shadow:0 4px 12px #0003;
overflow:hidden;
z-index:20;

}





.card-actions button{

width:160px;
padding:10px;
border:none;
background:white;
font-family:'Cairo',sans-serif;
text-align:right;

}







.name{

font-size:20px;
font-weight:bold;
margin:8px;

}



.info{

line-height:2;
color:#555;

}



.phone{

width:100%;
padding:11px;
background:#16a34a;
color:white;
border:none;
border-radius:10px;
font-size:16px;
font-family:'Cairo',sans-serif;

}




.modal{

display:none;
position:fixed;
inset:0;
background:#0008;
z-index:1000;
align-items:center;
justify-content:center;

}




.modal-box{

background:white;
width:90%;
max-width:380px;
border-radius:25px;
padding:20px;
text-align:center;
max-height:90vh;
overflow:auto;

}



.modal-title{

font-size:21px;
font-weight:bold;
margin-bottom:15px;

}



.modal-buttons{

display:flex;
gap:10px;

}



.modal-buttons button{

flex:1;
padding:12px;
border:none;
border-radius:12px;
color:white;
font-family:'Cairo',sans-serif;

}


.send{

background:#16a34a;

}


.close{

background:#777;

}


.call{

background:#2563eb;

}


.whatsapp{

background:#16a34a;

}



.modal-box img{

width:100px;
height:100px;
border-radius:50%;
object-fit:cover;

}



</style>

</head>

<body>


<!-- شاشة التحميل -->

<div id="loadingScreen">

<img src="https://www.aliftaa.jo/images/newIftaLogoJpg_.jpg">

<div class="spinner"></div>

<div class="loading-text">
جاري تحميل دليل الهاتف...
</div>

</div>



<header>

<img src="https://www.aliftaa.jo/images/newIftaLogoJpg_.jpg" class="logo">

<div>
📞 دليل هاتف موظفي دائرة الإفتاء العام
</div>

</header>




<div class="controls">



<div class="main-buttons">



<div class="service-menu">


<button class="service-main-btn"
onclick="toggleServices()">

⚙️ خدمات الدليل ▼

</button>



<div class="service-dropdown" id="serviceDropdown">


<button onclick="openAddRequest()">

➕ طلب إضافة جهة اتصال

</button>


</div>


</div>




<button class="refresh-btn"
onclick="refreshData()">

🔄 تحديث

</button>



</div>





<select id="searchType"
onchange="changePlaceholder()">



<option value="name">
الاسم
</option>


<option value="department">
المسمى الوظيفي
</option>


<option value="location">
موقع العمل
</option>


<option value="extension">
الرقم الفرعي
</option>


<option value="phone">
رقم الهاتف
</option>



</select>





<input id="searchInput"
placeholder="ابحث بالاسم..."
onkeydown="if(event.key==='Enter')searchEmployee()">





<div class="main-buttons">



<button id="searchButton"
class="search-btn"
onclick="searchEmployee()">

🔍 بحث

</button>




<button class="clear-btn"
onclick="clearSearch()">

✖ مسح

</button>



</div>



</div>





<div id="messageBox" class="message-box"></div>




<div class="counter" id="counter">

عدد الموظفين: 0

</div>




<div class="container" id="cards">

</div>







<!-- نافذة طلب إضافة -->

<div class="modal" id="addModal">


<div class="modal-box">


<div class="modal-title">

➕ طلب إضافة جهة اتصال

</div>




<input id="addName" placeholder="الاسم">


<input id="addPhone" placeholder="رقم الهاتف">


<input id="addExtension" placeholder="الرقم الفرعي">


<input id="addLocation" placeholder="موقع العمل">


<input id="addDepartment" placeholder="المسمى الوظيفي">


<textarea id="addNotes" placeholder="ملاحظات"></textarea>




<div class="modal-buttons">


<button class="send"
onclick="sendAddRequest()">

إرسال واتساب

</button>



<button class="close"
onclick="closeAddRequest()">

إغلاق

</button>



</div>



</div>


</div>






<!-- نافذة طلب تعديل -->


<div class="modal" id="editModal">


<div class="modal-box">


<div class="modal-title">

✏️ طلب تعديل بيانات

</div>




<input id="editName" readonly>


<input id="editPhone" placeholder="رقم الهاتف الجديد">


<input id="editExtension" placeholder="الرقم الفرعي الجديد">


<input id="editLocation" placeholder="موقع العمل الجديد">


<input id="editDepartment" placeholder="المسمى الوظيفي الجديد">


<textarea id="editNotes" placeholder="ملاحظات"></textarea>





<div class="modal-buttons">



<button class="send"
onclick="sendEditRequest()">

إرسال واتساب

</button>




<button class="close"
onclick="closeEditRequest()">

إغلاق

</button>



</div>



</div>


</div>






<!-- نافذة الاتصال -->


<div class="modal" id="contactModal">


<div class="modal-box">


<img id="contactImage" src="emp.png">



<div class="modal-title" id="contactName"></div>




<div class="modal-buttons">


<button class="call"
onclick="makeCall()">

☎ اتصال

</button>




<button class="whatsapp"
onclick="openWhatsApp()">

💬 واتساب

</button>


</div>





<br>


<button class="close"
style="width:100%;padding:12px;border:none;border-radius:12px;color:white;font-family:'Cairo'"
onclick="closeContact()">

إغلاق

</button>




</div>


</div>





<script>


let employees=[];

let currentEmployee=null;

let selectedPhone="";

let selectedName="";

let selectedImage="emp.png";


const adminWhatsApp="962796111656";



const sheetURL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTItYAMnnZRrpDxva40rx1kMEoyUNCtXZ-ft3Tdv28aBZUjwtNscq69M9G05MYf2TJcr6CgJCvY2LQC/pub?gid=0&single=true&output=csv";



function showMessage(text){


let box=document.getElementById("messageBox");


box.innerHTML=text;


box.style.display="block";


setTimeout(()=>{

box.style.display="none";

},4000);


}




// تحميل البيانات

async function loadEmployees(){


try{


let response=await fetch(sheetURL);



if(!response.ok){

throw new Error();

}



let csv=await response.text();



let rows=csv.split(/\r?\n/);



rows.shift();




employees=rows
.filter(row=>row.trim()!="")
.map(row=>{


let v=row.split(",");



return {


name:v[1] || "",

phone:v[2] || "",

extension:v[3] || "",

location:v[4] || "",

department:v[5] || "",

image:"emp.png"


};



});




restoreLastSearch();



hideLoading();



}

catch(e){


hideLoading();


showMessage(
"⚠️ تعذر الاتصال ببيانات دليل الهاتف"
);


}


}





// إخفاء شاشة التحميل

function hideLoading(){


document.getElementById("loadingScreen")
.style.display="none";


}





// تحديث البيانات

async function refreshData(){


document.getElementById("loadingScreen")
.style.display="flex";


document.querySelector(".loading-text").innerHTML=
"جاري تحديث البيانات...";



await loadEmployees();



}





// عرض الموظفين


function displayEmployees(list){



let box=document.getElementById("cards");



box.innerHTML="";



document.getElementById("counter").innerHTML=

"عدد الموظفين: "+list.length;




if(list.length===0){



showMessage(
"❌ لا توجد نتائج مطابقة للبحث"
);


return;


}





let html="";





list.forEach(emp=>{


html+=`


<div class="card">





<div class="card-menu">


<button class="card-menu-btn"
onclick="toggleCardMenu(this)">

⋮

</button>



<div class="card-actions">



<button onclick='openEditRequest(${JSON.stringify(emp)})'>

✏️ تعديل البيانات

</button>




<button onclick='showContact(${JSON.stringify(emp)})'>

☎ اتصال / واتساب

</button>



</div>



</div>






<img src="${emp.image}"
onerror="this.src='emp.png'">





<div class="name">

${escapeHTML(emp.name)}

</div>





<div class="info">


📍 ${escapeHTML(emp.location)}

<br>


🏢 ${escapeHTML(emp.department)}

<br>


☎ ${escapeHTML(emp.extension)}


</div>






<button class="phone"
onclick='showContact(${JSON.stringify(emp)})'>


☎ ${escapeHTML(emp.phone)}


</button>





</div>


`;



});




box.innerHTML=html;



}






// حماية النصوص

function escapeHTML(text){


return String(text)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");


}






// البحث

function searchEmployee(){



let btn=document.getElementById("searchButton");



btn.innerHTML="⏳ جاري البحث...";


btn.classList.add("loading");




setTimeout(()=>{



let text=
searchInput.value
.toLowerCase()
.trim();



let type=
searchType.value;




localStorage.setItem(
"lastSearch",
JSON.stringify({

type:type,

text:text

})

);





let result;



if(text===""){


result=employees;


}

else{


result=employees.filter(e=>

(e[type]||"")

.toLowerCase()

.includes(text)

);


}




displayEmployees(result);



btn.innerHTML="🔍 بحث";

btn.classList.remove("loading");



},100);





}





function clearSearch(){


searchInput.value="";


localStorage.removeItem("lastSearch");


displayEmployees(employees);


}





function restoreLastSearch(){



let saved=
localStorage.getItem("lastSearch");



if(saved){



let data=JSON.parse(saved);



searchType.value=data.type;


searchInput.value=data.text;



let result=employees.filter(e=>

(e[data.type]||"")

.toLowerCase()

.includes(
data.text.toLowerCase()
)

);



displayEmployees(result);



}

else{


displayEmployees(employees);


}



}





function changePlaceholder(){



let p={


name:"ابحث بالاسم...",


department:"ابحث بالمسمى الوظيفي...",


location:"ابحث بموقع العمل...",


extension:"أدخل الرقم الفرعي...",


phone:"أدخل رقم الهاتف..."


};



searchInput.placeholder=p[searchType.value];


}


// قائمة الخدمات

function toggleServices(){


let menu=document.getElementById("serviceDropdown");


menu.style.display =
menu.style.display==="block"
? "none"
: "block";


}




// قائمة خيارات الكارد

function toggleCardMenu(btn){


let menu=btn.nextElementSibling;



document.querySelectorAll(".card-actions")
.forEach(x=>{

if(x!==menu){

x.style.display="none";

}

});



menu.style.display =
menu.style.display==="block"
? "none"
: "block";


}





document.addEventListener("click",function(e){



if(!e.target.closest(".service-menu")){


let menu=document.getElementById("serviceDropdown");


if(menu){

menu.style.display="none";

}

}





if(!e.target.closest(".card-menu")){


document.querySelectorAll(".card-actions")
.forEach(x=>{

x.style.display="none";

});

}



});






// نافذة الاتصال


function showContact(emp){



selectedPhone=emp.phone;

selectedName=emp.name;

selectedImage=emp.image || "emp.png";



document.getElementById("contactName").innerHTML=
escapeHTML(emp.name);



document.getElementById("contactImage").src=
selectedImage;



document.getElementById("contactModal")
.style.display="flex";


}





function makeCall(){


window.location.href="tel:"+selectedPhone;


}





function openWhatsApp(){


let number=selectedPhone.replace(/^0/,"");



if(number.startsWith("7")){

number="962"+number;

}



window.open(

"https://wa.me/"+number+

"?text="+encodeURIComponent(

"السلام عليكم "+selectedName

)

);


}





function closeContact(){


document.getElementById("contactModal")
.style.display="none";


}







// التعديل


function openEditRequest(emp){



currentEmployee=emp;



editName.value=emp.name;

editPhone.value=emp.phone;

editExtension.value=emp.extension;

editLocation.value=emp.location;

editDepartment.value=emp.department;

editNotes.value="";



document.getElementById("editModal")
.style.display="flex";


}




function closeEditRequest(){


document.getElementById("editModal")
.style.display="none";


}





function sendEditRequest(){



let msg=

`
طلب تعديل بيانات موظف

الاسم:
${editName.value}

رقم الهاتف:
${editPhone.value}

الرقم الفرعي:
${editExtension.value}

موقع العمل:
${editLocation.value}

المسمى الوظيفي:
${editDepartment.value}

ملاحظات:
${editNotes.value}

التاريخ:
${new Date().toLocaleString("ar-JO")}
`;



window.open(

"https://wa.me/"+adminWhatsApp+

"?text="+encodeURIComponent(msg)

);


}







// الإضافة


function openAddRequest(){


document.getElementById("addModal")
.style.display="flex";


}





function closeAddRequest(){


document.getElementById("addModal")
.style.display="none";


}





function sendAddRequest(){



if(

addName.value.trim()=="" &&

addPhone.value.trim()=="" &&

addExtension.value.trim()=="" &&

addLocation.value.trim()=="" &&

addDepartment.value.trim()=="" &&

addNotes.value.trim()==""

){


alert("لا يجوز إرسال بيانات فارغة عبر الواتساب");


return;


}





let msg=

`
طلب إضافة جهة اتصال جديدة

الاسم:
${addName.value}

رقم الهاتف:
${addPhone.value}

الرقم الفرعي:
${addExtension.value}

موقع العمل:
${addLocation.value}

المسمى الوظيفي:
${addDepartment.value}

ملاحظات:
${addNotes.value}

التاريخ:
${new Date().toLocaleString("ar-JO")}

`;




window.open(

"https://wa.me/"+adminWhatsApp+

"?text="+encodeURIComponent(msg)

);


}






// تشغيل الصفحة


window.onload=function(){


loadEmployees();


};



</script>


</body>

</html>
